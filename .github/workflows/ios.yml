name: iOS build

# The iOS app, built on GitHub's macOS machines (free for public repositories), since the
# development machine is Windows and EAS device builds need a paid Apple Developer membership. One job
# makes an unsigned .ipa (Release, JavaScript bundled in) to sideload with a free Apple ID; the other
# runs the app in the iOS Simulator with Maestro and keeps screenshots in Arabic and English, light
# and dark, and of the Face ID lock.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ios.yml'
      - 'apps/mobile/.maestro/**'

env:
  EXPO_NO_TELEMETRY: 1
  TURBO_TELEMETRY_DISABLED: 1

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned iOS app
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Generate the iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install
        env:
          CI: 1
      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build the app and its widget, without signing
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          workspace=$(ls -d *.xcworkspace | head -1)
          xcodebuild -quiet \
            -workspace "$workspace" -scheme "${workspace%.xcworkspace}" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package the .ipa
        working-directory: apps/mobile/ios
        run: |
          app=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          echo "Built $app with: $(ls "$app/PlugIns" 2>/dev/null | tr '\n' ' ')"
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry Al-Murshid-unsigned.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: Al-Murshid-unsigned-ipa
          path: apps/mobile/ios/Al-Murshid-unsigned.ipa
          retention-days: 14

  simulator:
    name: iOS Simulator screenshots
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # On a slow machine Maestro's XCTest driver can take minutes to start: wait up to five.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
      MAESTRO_CLI_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Generate the iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install
        env:
          CI: 1
      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build for the simulator
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          workspace=$(ls -d *.xcworkspace | head -1)
          xcodebuild -quiet \
            -workspace "$workspace" -scheme "${workspace%.xcworkspace}" \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot an iPhone with Face ID enrolled, and install the app
        working-directory: apps/mobile/ios
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          for runtime in sorted((r for r in runtimes if 'iOS' in r), reverse=True):
              phones = [d for d in runtimes[runtime] if d['name'].startswith('iPhone')]
              if phones:
                  print(phones[0]['udid'])
                  break
          ")
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build/Build/Products/Release-iphonesimulator/*.app
          xcrun simctl spawn "$udid" notifyutil -s com.apple.BiometricKit.enrollmentChanged '1'
          xcrun simctl spawn "$udid" notifyutil -p com.apple.BiometricKit.enrollmentChanged

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Tour in Arabic and English, light and dark
        working-directory: apps/mobile/.maestro
        run: |
          # Every tour runs, so one failure still leaves the others' screenshots. A tour that fails
          # gets a second try: the simulator's driver sometimes stalls on a busy machine.
          tour() { maestro test -e LOCALE="$1" -e THEME="$2" tour.yaml; }
          status=0
          for theme in light dark; do
            xcrun simctl ui "$UDID" appearance "$theme"
            for locale in ar en; do
              tour "$locale" "$theme" || tour "$locale" "$theme" || status=1
            done
          done
          exit $status

      - name: The Face ID lock
        continue-on-error: true
        working-directory: apps/mobile/.maestro
        run: |
          # The simulator's "Matching Face", which a flow cannot send. A helper sends one every two
          # seconds while a flow waits on Face ID, from the moment the flow has photographed the
          # prompt (Maestro writes the screenshot into ~/.maestro/tests as it goes).
          match() { xcrun simctl spawn "$UDID" notifyutil -p com.apple.BiometricKit_Sim.pearl.match || true; }
          shot() { find ~/.maestro/tests -name "$1.png" 2>/dev/null | grep -q .; }
          faces() { until shot "$1"; do sleep 1; done; while :; do match; sleep 2; done; }
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          xcrun simctl ui "$UDID" appearance light
          faces lock-prompt & helper=$!
          maestro test lock-on.yaml
          kill $helper
          maestro test lock-check.yaml
          faces lock-locked &
          maestro test lock-open.yaml

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-simulator-screens
          # Maestro saves screenshots beside the flows, and what it saw when a step failed in ~/.maestro
          # with its own logs (the simulator's log runs to a hundred megabytes and stays behind).
          path: |
            apps/mobile/.maestro/*.png
            ~/.maestro/tests/**/*.png
            ~/.maestro/tests/**/*.json
            ~/.maestro/tests/**/logs/maestro.log
            ~/.maestro/tests/**/logs/device-xctest.log
          if-no-files-found: ignore
          retention-days: 14
