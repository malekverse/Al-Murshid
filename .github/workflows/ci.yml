name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Design tokens are up to date
        run: pnpm tokens:check
      - name: Every string exists in every locale
        run: pnpm i18n:check
      - name: Formatting
        run: pnpm format:check

      - name: Typecheck, lint and test (incl. contrast and RLS tests)
        run: pnpm turbo run typecheck lint test

      - name: Build the web app
        run: pnpm turbo run build --filter=@murshid/web
