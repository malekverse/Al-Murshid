# The app lock, part 1 (SPEC 5.7): turn it on and answer Face ID. Once this flow has photographed
# the prompt, the workflow sends a matching face (simctl) until the lock is on.
appId: com.malekverse.almurshid
name: Lock You (turn on)
---
- launchApp
- tapOn: You
- scrollUntilVisible:
    element:
      id: you-lock
    direction: DOWN
    timeout: 90000
    centerElement: true
- tapOn:
    id: you-lock
- tapOn:
    text: OK
    optional: true
- takeScreenshot: lock-prompt
# The switch reads 1 once it is on.
- extendedWaitUntil:
    visible:
      id: you-lock
      text: '1'
    timeout: 60000
- takeScreenshot: lock-on
