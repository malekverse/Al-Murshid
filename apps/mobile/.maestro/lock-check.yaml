# The app lock, part 2: a fresh start asks again before You opens. Once this flow has photographed
# the locked screen, the workflow sends a matching face, and lock-open.yaml checks You opened.
appId: com.malekverse.almurshid
name: Lock You (asks again)
---
- launchApp:
    stopApp: true
- tapOn: You
# While the Face ID sheet is up, only the sheet is visible to Maestro; the locked screen once it goes.
- extendedWaitUntil:
    visible: 'Face ID|Your space is locked'
    timeout: 15000
- takeScreenshot: lock-locked
