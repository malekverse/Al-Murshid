# Netlify (Phase 6): the project's build settings live in the Netlify app (base directory: the
# repository root; package directory: apps/web; build command: pnpm --filter @murshid/web build).
# Netlify serves `public/` itself, without next.config's headers, so the fixed-address Quran font
# gets its long cache here.

[[headers]]
  for = "/fonts/hafs/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
